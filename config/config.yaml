# 支持并行处理的多物种/项目配置
projects:
  - species: "TAIR"
    rawdata_dir: "workflow/resources/TAIR/fastqfile"
    hisat2_index: "workflow/anno/TAIR_arabidopsis/TAIR10_chr"
    gtf_file: "workflow/anno/TAIR_arabidopsis/TAIR10_chr.mRNA.gtf"
    modules:
      1_download: false
      2_QC: false
      3_Align_Filter: true
      4_DEseq: true
      5_enrichment: true

  - species: "homo"
    rawdata_dir: "workflow/resources/homo/fastqfile"
    hisat2_index: "workflow/anno/homo/homo_index"
    gtf_file: "workflow/anno/homo/homo.mRNA.gtf"
    modules:
      1_download: false
      2_QC: false
      3_Align_Filter: false

  - species: "mm"
    rawdata_dir: "workflow/resources/mm/fastqfile"
    hisat2_index: "workflow/anno/mm/mm_index"
    gtf_file: "workflow/anno/mm/mm.mRNA.gtf"
    modules:
      1_download: false
      2_QC: false
      3_Align_Filter: false

# DEG 差异基因筛选阈值
deg_pvalue_type: "padj"   # 使用 "pvalue" 或 "padj"
deg_pvalue_cutoff: 0.05   # 显著性阈值
deg_lfc_cutoff: 1.0       # |log2FoldChange| 最小值

# Picard 路径配置
picard_jar: "workflow/env/picard.jar"

# 线程配置
threads: 8
align_threads: 8
align_parallel: 2
quant_threads: 8
quant_parallel: 2
